name: 🚀 Deploy Angular App

on:
  push:
    branches:
      - main   # or whichever branch triggers deployment

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # or your version

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Angular app
        run: npm run ci:build

      - name: 🔑 Setup SSH
        run: |
            mkdir -p ~/.ssh
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -H -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: 📤 Deploy via rsync
        run: |
            rsync -avz --delete -e "ssh -p ${{ secrets.SSH_PORT }}" \
            dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_SERVER_PATH }}
